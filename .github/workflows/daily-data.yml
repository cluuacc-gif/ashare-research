name: A-share 18:00 daily data preparation

on:
  schedule:
    # GitHub cron uses UTC: 10:00 UTC = 18:00 Asia/Shanghai.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requests/after-close.json
      - cloud_daily.py
      - two_stage.py
      - trade_calendar.py
      - exchange_calendar_2026.json
      - test_two_stage.py
      - close_snapshot.py
      - publish_evening_transport.py
      - .github/workflows/daily-data.yml

permissions:
  contents: write

concurrency:
  group: ashare-after-close
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify session and stage boundaries
        run: python -m unittest -v test_two_stage.py
      - name: Collect real close data or skip a verified closed day
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python cloud_daily.py --scheduled --output evening-output
          else
            python cloud_daily.py --request requests/after-close.json --output evening-output
          fi
      - name: Save real responses and calendar/quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-evening-${{ github.run_id }}-${{ github.run_attempt }}
          path: evening-output/
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified immutable evidence for cross-session recovery
        if: ${{ always() && hashFiles('evening-output/source_acceptance.json') != '' }}
        env:
          DATA_ROOT: ${{ runner.temp }}/evening-data
        run: |
          if git ls-remote --exit-code --heads origin data/evening >/dev/null; then
            git fetch origin data/evening
            git worktree add --detach "$DATA_ROOT" FETCH_HEAD
          else
            git worktree add --detach "$DATA_ROOT" HEAD
            git -C "$DATA_ROOT" switch --orphan data/evening
          fi
          python publish_evening_transport.py --source-dir evening-output --data-root "$DATA_ROOT"
          git -C "$DATA_ROOT" config user.name ashare-research-bot
          git -C "$DATA_ROOT" config user.email ashare-research-bot@users.noreply.github.com
          git -C "$DATA_ROOT" add bundles catalog.json latest.json
          if ! git -C "$DATA_ROOT" diff --cached --quiet; then
            git -C "$DATA_ROOT" commit -m "Preserve verified daily source evidence $GITHUB_RUN_ID"
            git -C "$DATA_ROOT" push origin HEAD:refs/heads/data/evening
          fi
