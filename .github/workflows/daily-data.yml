name: A-share 18:00 daily data preparation

on:
  schedule:
    # GitHub cron uses UTC: 10:00 UTC = 18:00 Asia/Shanghai.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requests/after-close.json
      - cloud_daily.py
      - two_stage.py
      - trade_calendar.py
      - exchange_calendar_2026.json
      - test_two_stage.py
      - .github/workflows/daily-data.yml

permissions:
  contents: read

concurrency:
  group: ashare-after-close
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify session and stage boundaries
        run: python -m unittest -v test_two_stage.py
      - name: Collect real close data or skip a verified closed day
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python cloud_daily.py --scheduled --output evening-output
          else
            python cloud_daily.py --request requests/after-close.json --output evening-output
          fi
      - name: Save real responses and calendar/quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-evening-${{ github.run_id }}-${{ github.run_attempt }}
          path: evening-output/
          if-no-files-found: error
          retention-days: 90
