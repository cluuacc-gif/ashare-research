name: Trading-session research report
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ github.token }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check verified Shanghai exchange session before any restore or send
        id: gate
        run: python mail_gate.py --output mail-out/session-gate.json
      - name: Restore current hashed data snapshot
        if: steps.gate.outputs.send_allowed == 'true'
        run: python pipeline_state.py restore --destination "$RUNNER_TEMP/current"
      - name: Restore model matching current snapshot
        if: steps.gate.outputs.send_allowed == 'true'
        run: python model_store.py restore --store "$RUNNER_TEMP/current" --destination "$RUNNER_TEMP/model"
      - name: Render HTML and plain text then deliver exact-day research report
        if: steps.gate.outputs.send_allowed == 'true'
        env:
          DAY: ${{ steps.gate.outputs.day }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python snapshot_mail.py --stage "$STAGE" --day "$DAY" --store "$RUNNER_TEMP/current" --model-store "$RUNNER_TEMP/model" --output mail-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: mail-out/
          if-no-files-found: error
