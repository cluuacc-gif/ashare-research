name: Mail 09:00 morning research
on:
  schedule:
    # 01:00 UTC = 09:00 Asia/Shanghai
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ashare-mail-morning
  cancel-in-progress: false
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch canonical database from release store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/store"
          gh release download canonical-store-v5 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'market-database-v6-imported-20260925.sqlite3' \
            --pattern 'handoff-v7-updated-20260925.json' \
            --dir "$RUNNER_TEMP/store" || true
          if ! ls "$RUNNER_TEMP"/store/market-database-*.sqlite3 >/dev/null 2>&1; then
            gh release download canonical-store-v5 \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'market-database-v5.sqlite3' \
              --pattern 'handoff-v7.json' \
              --dir "$RUNNER_TEMP/store"
          fi
          DB=$(ls "$RUNNER_TEMP"/store/market-database-*.sqlite3 | tail -1)
          HO=$(ls "$RUNNER_TEMP"/store/handoff-*.json | tail -1)
          echo "DB=$DB" >> "$GITHUB_ENV"
          echo "HO=$HO" >> "$GITHUB_ENV"
      - name: Build morning report (combined with prior evening)
        run: |
          python mail_reports.py --stage morning --db "$DB" --handoff "$HO" \
            --output-dir mail-out --skip-closed
      - name: Send or draft email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO || 'mrzouhappy@outlook.com' }}
        run: |
          DAY=$(date +%F)
          BODY="mail-out/morning-${DAY}.md"
          if [ ! -f "$BODY" ]; then echo "no body"; ls -la mail-out; exit 0; fi
          python send_mail.py \
            --subject "A股研究 09:00晨间 ${DAY}" \
            --body-file "$BODY" \
            --draft-out "mail-out/morning-${DAY}.eml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-morning-${{ github.run_id }}
          path: mail-out/
          if-no-files-found: warn
