name: Mail 09:00 morning model research
on:
  schedule:
    # Warm at 08:33 Shanghai; only the 09:00 minute can submit SMTP.
    - cron: '33 0 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ashare-mail-morning
  cancel-in-progress: false
jobs:
  mail:
    uses: ./.github/workflows/session-report.yml
    with:
      stage: morning
    secrets: inherit
