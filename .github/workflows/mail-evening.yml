name: Mail evening from verified published snapshot
on:
  workflow_call:
    inputs:
      target_day:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      dry_run:
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ github.token }}
      TARGET_DAY: ${{ inputs.target_day }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently restore the exact release published by preparation
        run: python pipeline_state.py restore --release-tag "$RELEASE_TAG" --destination "$RUNNER_TEMP/current"
      - name: Generate and deliver with exact target date and file path
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          EXTRA=""
          if [ "$DRY_RUN" = true ]; then EXTRA="--dry-run"; fi
          python snapshot_mail.py --stage evening --day "$TARGET_DAY" --store "$RUNNER_TEMP/current" --output mail-out $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mail-evening-${{ github.run_id }}-${{ github.run_attempt }}
          path: mail-out/
          if-no-files-found: error

