name: Freeze next-session sector outlook and opening research plan
on:
  push:
    branches: [main]
    paths: [requests/market-outlook.json]
  pull_request:
    paths:
      - sector_forecast.py
      - opening_strength.py
      - market_outlook.py
      - fund_flow_pointer.py
      - market_outlook_report.py
      - test_sector_forecast.py
      - test_opening_strength.py
      - test_sector_opening_mail.py
      - test_market_outlook.py
      - snapshot_mail.py
      - mail_layout.py
      - .github/workflows/market-outlook.yml
      - requests/market-outlook.json
      - sector_fund_flow.py
      - sector_stock_selection.py
      - price_action_research.py
      - research_context.py
      - test_sector_fund_flow.py
      - test_sector_stock_selection.py
      - test_price_action_research.py
      - test_research_context.py
      - price_action_snapshot.py
      - test_price_action_snapshot.py
      - stock_strength_tracking.py
      - test_stock_strength_tracking.py
      - probability_panel.py
      - probabilistic_models.py
      - probability_validation.py
      - probability_research.py
      - probability_report.py
      - test_probability_panel.py
      - test_probabilistic_models.py
      - test_probability_validation.py
      - test_probability_research.py
      - test_probability_report.py
      - test_probability_integration.py
      - pa_trade_engine.py
      - pa_trade_features.py
      - pa_trade_research.py
      - pa_trade_report.py
      - pa_entry_confirmation.py
      - test_pa_trade_engine.py
      - test_pa_trade_features.py
      - test_pa_trade_research.py
      - test_pa_trade_report.py
      - test_pa_entry_confirmation.py
      - test_pa_trade_integration.py
      - nextday_cohort.py
      - nextday_minutes.py
      - nextday_forward.py
      - nextday_report.py
      - test_nextday_cohort.py
      - test_nextday_minutes.py
      - test_nextday_forward.py
      - test_nextday_report.py
      - test_nextday_integration.py
      - outlook_admission.py
      - test_outlook_admission.py
      - active_trade_system.py
      - active_price_action.py
      - active_regime.py
      - active_holding.py
      - test_regime_holding.py
      - verify_published_compatibility.py
      - fixtures/legacy-active-reports.json
      - security_selection.py
      - current_selection_scope.py
      - test_selection_upgrade.py
      - test_current_selection_scope.py
      - active_trade_book.py
      - active_trade_report.py
      - test_active_trade_system.py
      - test_active_trade_book.py
      - test_active_trade_report.py
      - test_active_trade_integration.py
  workflow_dispatch:
  workflow_run:
    workflows: [A-share automatic after-close pipeline]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ashare-market-outlook-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publisher' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: python -m pip install -r requirements-model.txt
      - name: Check information cutoffs, opening confirmation and mail content
        run: >-
          python -m unittest -v test_sector_forecast.py test_opening_strength.py
          test_sector_opening_mail.py test_market_outlook.py test_mail_upgrade.py
          test_autonomous_mailer.py test_mail_timing.py
          test_sector_fund_flow.py test_sector_stock_selection.py
          test_price_action_research.py test_research_context.py
          test_price_action_snapshot.py test_stock_strength_tracking.py
          test_probability_panel.py test_probabilistic_models.py
          test_probability_validation.py test_probability_research.py
          test_probability_report.py test_probability_integration.py
          test_pa_trade_engine.py test_pa_trade_features.py test_pa_trade_research.py
          test_pa_trade_report.py test_pa_entry_confirmation.py test_pa_trade_integration.py
          test_nextday_cohort.py test_nextday_minutes.py test_nextday_forward.py
          test_nextday_report.py test_nextday_integration.py
          test_outlook_admission.py
          test_active_trade_system.py test_active_trade_book.py
          test_active_trade_report.py test_active_trade_integration.py test_selection_upgrade.py
          test_current_selection_scope.py
          test_regime_holding.py
      - name: Reproduce pinned v1 and v2 publications without changing historical records
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        run: python verify_published_compatibility.py
  freeze:
    needs: verify
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: python -m pip install -r requirements-model.txt
      - name: Record the source commit actually checked out
        run: echo "OUTLOOK_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Read enabled research request
        id: request
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path('requests/market-outlook.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('enabled='+str(value.get('enabled') is True).lower()+'\n')
          PY
      - name: Verify a new prospective freeze is still possible before downloading the market database
        id: admission
        if: steps.request.outputs.enabled == 'true'
        run: |
          python - <<'PY'
          import json, os
          import collector as c
          import pipeline_state as state
          from outlook_admission import evaluate, render
          from pathlib import Path
          source,_=state.pointer(os.environ['GITHUB_REPOSITORY'])
          result=evaluate(source,c.now())
          root=Path('outlook-admission-out');root.mkdir()
          if not result['ready']:
              from nextday_minutes import capture
              probe=capture(['000001.SZ'],root/'minute-transport-probe')
              result['minute_transport']={'symbols_requested':1,
                  'symbols_available':sum(bool(item.get('bars')) for item in probe.values()),
                  'validation_scope':'transport_only_not_trading_performance'}
          state.write(root/'status.json',result)
          (root/'report.html').write_text(render(result),encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('ready='+str(result['ready']).lower()+'\n')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Restore current immutable market data with independent hash verification
        if: steps.request.outputs.enabled == 'true' && steps.admission.outputs.ready == 'true'
        run: python pipeline_state.py restore --destination "$RUNNER_TEMP/outlook-source"
      - name: Research mathematical price action with separate T+1 and three-day outcomes
        if: steps.request.outputs.enabled == 'true' && steps.admission.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'outlook-source'
          source=json.loads((root/'restore.json').read_text())['manifest']
          subprocess.run([sys.executable,'price_action_research.py','--db',str(root/source['database']['name']),
              '--base',source['base_trade_date'],'--input-sha256',source['database']['sha256'],
              '--output','price-action-out'],check=True)
          PY
      - name: Capture actual vendor industry money flow and same-vendor constituents
        if: steps.request.outputs.enabled == 'true' && steps.admission.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          source=json.loads((Path(os.environ['RUNNER_TEMP'])/'outlook-source/restore.json').read_text())['manifest']
          subprocess.run([sys.executable,'sector_fund_flow.py','--base',source['base_trade_date'],
              '--output','fund-flow-out'],check=True)
          PY
      - name: Compare probability and context-based T+1 trading from one causal market scan
        if: steps.request.outputs.enabled == 'true' && steps.admission.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'outlook-source'
          source=json.loads((root/'restore.json').read_text())['manifest']
          subprocess.run([sys.executable,'pa_trade_research.py','--db',str(root/source['database']['name']),
              '--base',source['base_trade_date'],'--input-sha256',source['database']['sha256'],
              '--output','pa-trade-out','--probability-output','probability-out'],check=True)
          PY
      - name: Freeze actual next-session outlook and publish verified research assets
        if: steps.request.outputs.enabled == 'true' && steps.admission.outputs.ready == 'true'
        run: >-
          python market_outlook.py --store "$RUNNER_TEMP/outlook-source" --output market-outlook-out
          --fund-flow-dir fund-flow-out --price-action-dir price-action-out --probability-dir probability-out
          --pa-trade-dir pa-trade-out --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-outlook-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            market-outlook-out/
            outlook-admission-out/
          if-no-files-found: warn
