name: Mail 09:25 model observation
on:
  schedule:
    # Warm at 09:03 Shanghai; delivery remains at 09:25 with no catch-up.
    - cron: '3 1 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ashare-mail-auction
  cancel-in-progress: false
jobs:
  mail:
    uses: ./.github/workflows/session-report.yml
    with:
      stage: auction
    secrets: inherit
