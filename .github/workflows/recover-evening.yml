name: Recover already collected daily evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - requests/recover-evening.json
      - .github/workflows/recover-evening.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: ashare-after-close
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preserved evidence and publish durable transport
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_ROOT: ${{ runner.temp }}/evening-data
        run: |
          if git ls-remote --exit-code --heads origin data/evening >/dev/null; then
            git fetch origin data/evening
            git worktree add --detach "$DATA_ROOT" FETCH_HEAD
          else
            git worktree add --detach "$DATA_ROOT" HEAD
            git -C "$DATA_ROOT" switch --orphan data/evening
          fi
          python publish_evening_transport.py --recover-request requests/recover-evening.json --data-root "$DATA_ROOT"
          git -C "$DATA_ROOT" config user.name ashare-research-bot
          git -C "$DATA_ROOT" config user.email ashare-research-bot@users.noreply.github.com
          git -C "$DATA_ROOT" add bundles catalog.json latest.json
          if ! git -C "$DATA_ROOT" diff --cached --quiet; then
            git -C "$DATA_ROOT" commit -m "Recover original evening evidence without market downloads"
            git -C "$DATA_ROOT" push origin HEAD:refs/heads/data/evening
          fi
