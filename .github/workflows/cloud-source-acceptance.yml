name: A-share real data source acceptance

on:
  workflow_dispatch:
    inputs:
      through:
        description: '历史查询截止上界 YYYY-MM-DD；留空由北京时间收盘状态确定'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - cloud_probe.py
      - collector.py
      - import_probe_artifact.py
      - requirements.txt
      - .github/workflows/cloud-source-acceptance.yml

permissions:
  contents: read

concurrency:
  group: ashare-real-data-acceptance
  cancel-in-progress: false

jobs:
  source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Read official master and real 250-bar histories
        env:
          REQUESTED_THROUGH: ${{ inputs.through }}
        shell: bash
        run: |
          args=(--output cloud-output)
          if [ -n "$REQUESTED_THROUGH" ]; then
            args+=(--through "$REQUESTED_THROUGH")
          fi
          python cloud_probe.py "${args[@]}"
      - name: Preserve actual responses and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-source-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: cloud-output/
          if-no-files-found: warn
          retention-days: 30
